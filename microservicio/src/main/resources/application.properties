spring.application.name=microservicio-consejos
server.port=8080

# Base de datos H2 en archivo: los datos se conservan entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/tiotec;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de la base: http://localhost:8080/h2-console
spring.h2.console.enabled=true
